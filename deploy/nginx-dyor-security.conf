# DYOR (dyor.cryptoopsec.com) — transport security for the TLS server block.
#
#   cp deploy/nginx-dyor-security.conf /etc/nginx/snippets/dyor-security.conf
#   # inside the 443 server block of the live vhost, after certbot's include:
#   #   include /etc/nginx/snippets/dyor-security.conf;
#   nginx -t && systemctl reload nginx
#
# The Next.js app sets the content headers itself (next.config.mjs: nosniff,
# X-Frame-Options, Referrer-Policy, Permissions-Policy) so they travel with the
# app; HSTS belongs here because it is a TLS property.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
