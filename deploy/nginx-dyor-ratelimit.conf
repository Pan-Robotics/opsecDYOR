# Per-IP rate-limit zones for the DYOR API — http-level directives, so this
# file lives in /etc/nginx/conf.d/ (included at http scope), not in the vhost.
#
#   cp deploy/nginx-dyor-ratelimit.conf /etc/nginx/conf.d/dyor-ratelimit.conf
#   deploy/apply-nginx-ratelimit.sh        # adds the limit_req lines to the live vhost
#   nginx -t && systemctl reload nginx
#
# Why: /api/analyze, /api/memo, /api/portfolio and /mcp each trigger LIVE
# upstream collection — ~10 calls per token on shared per-IP CoinGecko limits and
# a 1,000/month Santiment quota — and each parks a worker thread for 30–90 s.
# Unthrottled, one script can exhaust the quota (silently dropping features and
# moving scores) or stall the API.
#
# dyor_api   — everything under /api/ and /openapi.json: cheap reads.
# dyor_live  — the endpoints that collect live data: tight.
limit_req_zone $binary_remote_addr zone=dyor_api:10m  rate=60r/m;
limit_req_zone $binary_remote_addr zone=dyor_live:10m rate=6r/m;
limit_req_status 429;
