# /etc/logrotate.d/dyor-refresh — rotation for the weekly refresh log.
# `su root root` is required: /var/log is group-writable (syslog) on Ubuntu and
# logrotate refuses to rotate under an "insecure" parent without it — which
# silently skipped rotation until the deployment sweep caught it (2026-09-26).
/var/log/dyor-refresh.log {
    su root root
    monthly
    rotate 12
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
}
