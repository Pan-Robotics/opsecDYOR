# DYOR subdomain — Next.js UI (:3010) + FastAPI engine (:8077), same origin.
#
#   cp deploy/nginx-dyor.conf /etc/nginx/sites-available/dyor.cryptoopsec.com
#   ln -s /etc/nginx/sites-available/dyor.cryptoopsec.com /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d dyor.cryptoopsec.com      # adds the TLS/443 block + redirect
#
# Same-origin design: the browser loads the UI and calls /api/* on the SAME host,
# so there is no CORS and no cross-origin config to maintain.

server {
    listen 80;
    listen [::]:80;
    server_name dyor.cryptoopsec.com;

    # --- FastAPI scoring engine (same-origin API) ---
    location /api/ {
        proxy_pass http://127.0.0.1:8077;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;        # first live token collection can be slow
    }
    location = /openapi.json {
        proxy_pass http://127.0.0.1:8077;
    }

    # --- Hosted MCP server (streamable-http) for AI agents ---
    # Agents connect at https://dyor.cryptoopsec.com/mcp — no local install needed.
    # Streaming endpoint (SSE-style): buffering OFF and long timeouts are required.
    location /mcp {
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Connection "";          # keep-alive upstream (not websocket)
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;                      # flush server→client events immediately
        proxy_cache off;
        proxy_read_timeout 3600s;                 # long-lived event streams
        chunked_transfer_encoding on;
    }

    # --- Next.js UI (everything else) ---
    location / {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
